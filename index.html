<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดาวน์โหลด SaleSnap POS</title>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #64748b; font-size: 15px; line-height: 1.5; }
    .badge-grid {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .badge-card {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      width: 180px;
    }
    .qr-image { width: 140px; height: 140px; border-radius: 8px; background: #fff; }
    .btn {
      display: block;
      margin-top: 12px;
      padding: 10px 16px;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-ios { background-color: #000000; }
    .btn-android { background-color: #059669; }
    #mobile-view, #desktop-view { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- มุมมองสำหรับมือถือ (Mobile View) -->
    <div id="mobile-view">
      <h1>SaleSnap POS</h1>
      <p>กำลังนำท่านไปยัง Store...</p>
      <div style="margin-top: 24px;">
        <p>หากระบบไม่เปลี่ยนหน้าอัตโนมัติ เลือกดาวน์โหลดได้ที่นี่:</p>
        <a id="btn-mobile-ios" class="btn btn-ios" href="#">App Store (iOS)</a>
        <a id="btn-mobile-android" class="btn btn-android" href="#">Google Play (Android)</a>
      </div>
    </div>

    <!-- มุมมองสำหรับคอมพิวเตอร์ (Desktop / PC View) -->
    <div id="desktop-view">
      <h1>SaleSnap POS</h1>
      <p>สแกน QR Code ด้วยสมาร์ตโฟนเพื่อดาวน์โหลดแอป</p>
      <div class="badge-grid">
        <div class="badge-card">
          <img id="qr-ios" class="qr-image" src="" alt="QR Code iOS">
          <a id="btn-desktop-ios" class="btn btn-ios" href="#" target="_blank">เปิด App Store</a>
        </div>
        <div class="badge-card">
          <img id="qr-android" class="qr-image" src="" alt="QR Code Android">
          <a id="btn-desktop-android" class="btn btn-android" href="#" target="_blank">เปิด Google Play</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // กำหนด URL ปลายทางของ Store
    const iosUrl = "https://apps.apple.com/th/app/salesnap/id6805793799";
    const androidUrl = "https://play.google.com/store/apps/details?id=org.chiangmeng.salesnap";

    // อัปเดตลิงก์ไปยังปุ่มและ QR Code
    document.getElementById("btn-mobile-ios").href = iosUrl;
    document.getElementById("btn-mobile-android").href = androidUrl;
    document.getElementById("btn-desktop-ios").href = iosUrl;
    document.getElementById("btn-desktop-android").href = androidUrl;
    document.getElementById("qr-ios").src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + encodeURIComponent(iosUrl);
    document.getElementById("qr-android").src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + encodeURIComponent(androidUrl);

    // ตรวจสอบประเภทอุปกรณ์
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isAndroid = /android/i.test(userAgent);

    if (isIOS) {
      document.getElementById("mobile-view").style.display = "block";
      setTimeout(function() {
        window.location.replace(iosUrl);
      }, 500);
    } else if (isAndroid) {
      document.getElementById("mobile-view").style.display = "block";
      setTimeout(function() {
        window.location.replace(androidUrl);
      }, 500);
    } else {
      document.getElementById("desktop-view").style.display = "block";
    }
  </script>
</body>
</html>

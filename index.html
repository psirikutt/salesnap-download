<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaleSnap Download</title>
  <script>
    // ตรวจสอบอุปกรณ์เพื่อเปลี่ยนเส้นทาง
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace("https://apps.apple.com/app/idXXXXXXXXX");
    } else if (/android/i.test(ua)) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.yourpackage.salesnap");
    } else {
      window.location.replace("https://facebook.com/yourpage");
    }
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 30%; font-family: sans-serif; font-size: 16px; color: #555;">
    กำลังพาไปยังหน้าร้านค้าเพื่อดาวน์โหลด...
  </p>
</body>
</html>
